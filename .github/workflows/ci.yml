name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    # windows-latest matches the target platform; the ubuntu job exists to
    # catch path-separator and encoding assumptions early.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # No `playwright install chromium`: the long-image exporter degrades
        # to preview.html when the browser is missing, and the suite never
        # takes a screenshot.
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install ruff
      - run: ruff check .
